name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Projenin bağımlılığı yok; npm install adımı bilerek atlanıyor.
      - name: Testleri çalıştır
        run: npm test

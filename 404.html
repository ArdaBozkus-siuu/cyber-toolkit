<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı — Siber Araç Kutusu</title>
<link rel="icon" href="/cyber-toolkit/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cyber-toolkit/assets/css/app.css">
<script>
  (() => { try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.tema = t; } catch {} })();
</script>
</head>
<body>

<header class="ust">
  <div class="ust-ic">
    <a class="marka" href="/cyber-toolkit/">
      <svg viewBox="0 0 28 20" aria-hidden="true" focusable="false" class="marka-isaret">
        <rect x="0.5" y="6" width="4" height="8" rx="1" fill="currentColor"/>
        <rect x="6" y="4" width="4" height="12" rx="1" fill="currentColor"/>
        <rect x="11.5" y="2" width="4" height="16" rx="1" fill="currentColor"/>
        <rect x="17" y="4" width="4" height="12" rx="1" fill="currentColor" opacity="0.45"/>
        <rect x="22.5" y="6" width="4" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
      </svg> Siber Araç Kutusu</a>
    <button type="button" id="tema-btn" class="tema-btn" aria-label="Koyu temaya geç"></button>
  </div>
</header>

<main class="kabuk">
  <section class="bulunamadi">
    <p class="kod">404</p>
    <h1>Bu adreste bir şey yok</h1>
    <p>
      Aradığın sayfa taşınmış ya da adres yanlış yazılmış olabilir. Araçların tamamı
      ana sayfada listeli.
    </p>
    <p><a href="/cyber-toolkit/">Araç kutusuna dön</a></p>
  </section>
</main>

<script type="module" src="/cyber-toolkit/assets/js/tema.js"></script>
</body>
</html>
